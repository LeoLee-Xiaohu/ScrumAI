[project]
name = "scrumai-prompts"
version = "0.2.0"
description = "ScrumAI Prompt Playground - Debug and test AI prompts for the ScrumAI Forge Jira plugin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.86.0",
    "fastapi>=0.115.0",
    "google-genai>=0.3.0",
    "httpx>=0.28.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.1",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
scrumai = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
