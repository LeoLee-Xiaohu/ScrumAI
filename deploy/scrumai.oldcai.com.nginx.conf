# nginx vhost for scrumai.oldcai.com
#
# Install:
#   sudo cp deploy/scrumai.oldcai.com.nginx.conf /etc/nginx/sites-available/scrumai.oldcai.com
#   sudo ln -s /etc/nginx/sites-available/scrumai.oldcai.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cert: see deploy/README.md for certbot options. Until certs exist, the
# 443 server block will fail to load — comment it out, run certbot, then
# re-enable.

# HTTP -> HTTPS redirect (also serves the ACME http-01 challenge path).
server {
    listen 80;
    listen [::]:80;
    server_name scrumai.oldcai.com;

    # certbot --webroot writes the challenge token here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scrumai.oldcai.com;

    ssl_certificate     /etc/letsencrypt/live/scrumai.oldcai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scrumai.oldcai.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Cheap baseline hardening. Forge pins HTTPS so HSTS just enforces what
    # the client already does; the rest stop accidental MIME-sniffing /
    # framing of API responses if a misconfigured browser ever loads them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    # Demo deploy — NOT rate-limited and NOT brute-force-throttled. Forge
    # is the only legitimate caller and lock contention naturally serializes
    # the engine, but a leaked API key would let an attacker hammer
    # /sync/tick. If you're putting this in front of real users, bolt on
    # nginx limit_req zone + a fail2ban jail before exposing publicly.

    # Forge plugin only needs the API. Anything else gets a 404 quickly so
    # we don't accidentally expose internal paths.
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sync/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /sync/tick can take 5-10s on a real Jira+VK round-trip.
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location / {
        return 404;
    }

    # Modest access log so we can see Forge calls land. Errors -> default.
    access_log /var/log/nginx/scrumai.access.log;
}
